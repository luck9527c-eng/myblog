# blog-web（Nginx）：托管前端静态资源 + 反向代理 API 到 blog-backend
# 该文件在镜像内被复制为 /etc/nginx/conf.d/default.conf

upstream blog_backend {
    server blog-backend:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Markdown 正文可能较长，留足余量；后端另有自身校验
    client_max_body_size 8m;
    client_body_timeout 30s;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml font/woff2 image/svg+xml;

    # ---- 运维健康检查 ----
    location = /health {
        proxy_pass http://blog_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # 让 Cookie 透传（HttpOnly 由后端设置），不在此处改写
        proxy_buffering off;
    }

    # ---- 构建产物：内容哈希文件，长期缓存 ----
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ---- 用户上传图片：只读挂载卷静态直出 ----
    location /uploads/ {
        alias /data/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # ---- SPA 前端路由 ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 安全响应头（不使用 HTTPS 时同样安全地生效）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /index.html;
}
